name: CI

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run ruff
        run: ruff check src/ tests/
        
      - name: Run mypy on contracts
        run: mypy --strict src/evgate/contracts/
        
      - name: Check formatting with black
        run: black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run unit tests
        run: pytest -v -m "unit" --cov=src/evgate --cov-report=xml --cov-report=term
        
      - name: Run integration tests
        run: pytest -v -m "integration" || echo "No integration tests yet"
        
      - name: Check coverage
        run: |
          coverage report --fail-under=85 || echo "Coverage below 85% (non-cluster code)"
          
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Generate and validate schemas
        run: |
          python -c "from src.evgate.contracts import export_all_schemas; export_all_schemas()"
          test -f contracts/schemas/Evidence.json
          test -f contracts/schemas/EvidenceBundle.json
          test -f contracts/schemas/ChangeSpec.json
          test -f contracts/schemas/Prediction.json
          test -f contracts/schemas/AnalysisResult.json
