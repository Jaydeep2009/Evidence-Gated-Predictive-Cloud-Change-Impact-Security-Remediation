apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role-restricted
  namespace: poc-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]  # Only get, no list or watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-role-binding-restricted
  namespace: poc-app
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: poc-app
roleRef:
  kind: Role
  name: backend-role-restricted
  apiGroup: rbac.authorization.k8s.io
